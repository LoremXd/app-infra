apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-redis-0
  namespace: robot-shop
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: "/mnt/redis"

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-redis-0
  namespace: robot-shop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-storage

