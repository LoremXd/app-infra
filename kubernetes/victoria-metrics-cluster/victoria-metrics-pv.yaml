apiVersion: v1
kind: PersistentVolume
metadata:
  name: vmstorage-volume-vmcluster-victoria-metrics-cluster-vmstorage-1
  namespace: monitoring
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: "/mnt/victoria-metrics-1"

